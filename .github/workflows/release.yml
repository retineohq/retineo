name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - run: pnpm install --frozen-lockfile
      - name: Rebuild better-sqlite3 from source
        run: |
          cd node_modules/.pnpm/better-sqlite3@*/node_modules/better-sqlite3
          npx node-gyp rebuild
      - run: pnpm build
      - run: pnpm test

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - run: pnpm install --frozen-lockfile
      - name: Rebuild better-sqlite3 from source
        run: |
          cd node_modules/.pnpm/better-sqlite3@*/node_modules/better-sqlite3
          npx node-gyp rebuild
      - run: pnpm build

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-binaries:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: macos-x64
          - os: windows-latest
            target: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - run: sudo apt-get update && sudo apt-get install -y build-essential python3
        if: matrix.os == 'ubuntu-latest'

      - run: pnpm install --frozen-lockfile
      - name: Rebuild better-sqlite3 from source
        run: |
          cd node_modules/.pnpm/better-sqlite3@*/node_modules/better-sqlite3
          npx node-gyp rebuild
      - run: pnpm build

      # pkg не поддерживает native модули (better-sqlite3)
      # Собираем только JS bundle без бинарников
      - run: pnpm bundle:binary
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: retineo-${{ matrix.target }}
          path: dist/bundle.cjs
        continue-on-error: true

  release-github:
    needs: [publish-npm, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: retineo-*
          merge-multiple: true
        continue-on-error: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        continue-on-error: true
