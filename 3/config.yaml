dataDir: '3'
defaultAdapter: file
llmProvider: ollama
embeddingModel: nomic-embed-text-v2-moe:latest
llm:
  defaultProvider: ollama
  providers:
    - id: ollama
      type: ollama
      baseUrl: http://localhost:11434
      model: granite3.1-dense:2b
      temperature: 0.3
      maxTokens: 4096
      concurrency: 1
      timeoutMs: 60000
embedding:
  defaultProvider: ollama-embed
  providers:
    - id: ollama-embed
      type: ollama
      baseUrl: http://localhost:11434
      model: nomic-embed-text-v2-moe:latest
      concurrency: 1
      timeoutMs: 60000
      dimension: 768
bridge:
  host: 127.0.0.1
  port: 3
search:
  defaultLanguage: en
  languageDetection:
    provider: franc
    fallback: heuristic
    confidenceThreshold: 0.7
  semantic:
    topK: 100
    threshold: 0.35
    hybridWeight: 0.7
  rerank:
    topK: 10
    weights:
      concept: 1
      claim: 0.5
      summary: 0.8
      language: 0.3
  cascade:
    budgets:
      vague: 500
      section: 800
      precision: 1500
  citations:
    format: markdown
    includeLineNumbers: true
    includeTimestamps: true
  prompts: {}
  crossLingual:
    enabled: true
i18n:
  defaultLanguage: en
  packs: []
logging:
  level: info
  console: true
  file: true
  filePath: ''
  pretty: false
